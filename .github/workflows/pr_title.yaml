name: pr_title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@557b368818057671290792fb86f2b57c3d806af2 # v1.2.10
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
